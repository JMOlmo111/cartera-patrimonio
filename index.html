<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'sha256-u1CRKAOoy17t8geWJRhtE6rNkBPe9WoIRMrclGiCfNs='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://cdnjs.cloudflare.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Cartera Patrimonio</title>
  <meta name="description" content="Asesor personal de inversiones: patrimonio, cartera y mercados.">
  <meta name="theme-color" content="#0F1A2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Patrimonio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/estilos.css">
  <script>
    // Aplica el tema guardado antes de pintar (evita parpadeo)
    try { var t = localStorage.getItem('cp_tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="cabecera">
    <div class="marca">
      <img src="icons/icon-192.png" alt="" width="32" height="32">
      <div>
        <h1 id="titulo-pantalla">Mi patrimonio</h1>
        <p id="estado-sync" class="sync" aria-live="polite">—</p>
      </div>
    </div>
    <div class="acciones-cabecera">
      <button id="btn-refrescar" class="icono" aria-label="Actualizar datos" title="Actualizar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
      <button id="btn-ajustes" class="icono" aria-label="Ajustes" title="Ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="aviso-offline" class="banda" hidden></div>

  <main id="contenido" tabindex="-1">
    <!-- Pantalla de bienvenida / conexión -->
    <section id="v-conexion" class="vista" hidden>
      <div class="tarjeta bienvenida">
        <h2>Conecta la app con tu servidor</h2>
        <p>Pega la dirección de tu aplicación web de Apps Script y el código de acceso que obtuviste al ejecutar <code>instalar()</code>. Se guardan solo en este dispositivo.</p>
        <form id="form-conexion" class="formulario">
          <label>Dirección de la aplicación web
            <input name="url" type="url" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
          </label>
          <label>Código de acceso
            <input name="token" type="password" required minlength="20" autocomplete="off" placeholder="32 caracteres">
          </label>
          <button class="btn primario" type="submit">Conectar</button>
          <p id="conexion-error" class="error" role="alert"></p>
        </form>
      </div>
    </section>

    <section id="v-patrimonio" class="vista" hidden></section>
    <section id="v-oro" class="vista" hidden></section>
    <section id="v-fondos" class="vista" hidden></section>
    <section id="v-cartera" class="vista" hidden></section>
    <section id="v-informes" class="vista" hidden></section>
  </main>

  <nav class="navegacion" aria-label="Secciones">
    <button data-vista="patrimonio" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Patrimonio</span></button>
    <button data-vista="oro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10h12l3 8H3zM9 4h6l2 6H7z"/></svg><span>Oro</span></button>
    <button data-vista="fondos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg><span>Fondos</span></button>
    <button data-vista="cartera">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6V4h8v2M3 12h18"/></svg><span>Cartera</span></button>
    <button data-vista="informes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-6A8 8 0 1 1 21 12z"/></svg><span>Asesor</span></button>
  </nav>

  <!-- Ventana modal reutilizable -->
  <dialog id="modal" aria-labelledby="modal-titulo">
    <form method="dialog" class="modal-cab">
      <h2 id="modal-titulo"></h2>
      <button class="icono" value="cerrar" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>
    <div id="modal-cuerpo"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
